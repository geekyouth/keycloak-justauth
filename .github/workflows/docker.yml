name: Build and Push Keycloak Image (GHCR)

on:
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: "Keycloak 基础镜像版本（26.7）"
        required: true
        default: "26.7"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

# 使用内置的 GITHUB_TOKEN 推送到你自己账号下的 GHCR，无需额外配置 secrets
permissions:
  contents: read
  packages: write

env:
  KEYCLOAK_VERSION: ${{ inputs.keycloak_version || '26.7' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin jar
        run: mvn -B clean package -DskipTests

      - name: Pick jar
        run: |
          JAR=$(ls target/*-jar-with-dependencies.jar 2>/dev/null | head -n1 || true)
          if [ -z "$JAR" ]; then
            JAR=$(ls target/*.jar | grep -v -E '(original|sources|javadoc)' | head -n1)
          fi
          [ -n "$JAR" ] || { echo "::error::target/ 下没有找到 jar"; exit 1; }
          echo "Using jar: $JAR"
          mkdir -p build
          cp "$JAR" build/keycloak-justauth.jar
          unzip -l build/keycloak-justauth.jar > build/jar-list.txt
          if ! grep -q 'me/zhyd/oauth/' build/jar-list.txt; then
            echo "::warning::jar 中未发现 JustAuth 依赖，运行时可能出现 ClassNotFoundException，请确认 pom 是否打成了 fat jar"
          fi
          rm build/jar-list.txt

      - name: Generate Dockerfile
        run: |
          cat > build/Dockerfile <<'EOF'
          ARG KEYCLOAK_VERSION=26.7
          FROM quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
          COPY keycloak-justauth.jar /opt/keycloak/providers/keycloak-justauth.jar
          EOF

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keycloak-justauth" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build
          file: build/Dockerfile
          push: true
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ env.KEYCLOAK_VERSION }}
            ${{ env.IMAGE }}:latest
